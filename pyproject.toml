[project]
name = "pycaret"
version = "4.0.0.dev0"
description = "PyCaret 4.0 — lean, modern, agent-native open-source AutoML engine."
readme = "README.md"
keywords = [
  "automl",
  "machine-learning",
  "classification",
  "regression",
  "clustering",
  "anomaly-detection",
  "time-series",
  "scikit-learn",
  "llm-agents",
]
license = { file = "LICENSE" }
authors = [{ name = "PyCaret developers" }]
maintainers = [{ name = "Moez Ali" }]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]

# Core runtime dependencies. Keep this list lean and without upper-bound pins.
# Anything that isn't needed to execute setup -> compare_models -> predict_model
# on a medium sklearn dataset belongs in an optional extra.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  # Upper cap on sklearn is driven by sktime <1.8 constraint (see docs/revamp/DECISIONS.md).
  # When sktime releases a version declaring scikit-learn<1.9 we bump this.
  "scikit-learn>=1.7,<1.8",
  "joblib>=1.4",
  "cloudpickle>=3.0",
  "lightgbm>=4.3",
  "category-encoders>=2.6",
  "imbalanced-learn>=0.13",
  "plotly>=5.22",
  "kaleido>=0.2",
  # matplotlib kept as a transitional dep — it's only pulled in by the
  # pre-Plotly plot paths and residual yellowbrick-shaped code. Phase 3 of the
  # revamp (see docs/revamp/ROADMAP.md) removes this once all plots are Plotly.
  "matplotlib>=3.9",
  "ipython>=8.18",
  "ipywidgets>=8.1",
  "tqdm>=4.66",
  "jinja2>=3.1",
  "requests>=2.32",
  "psutil>=5.9",
  "nbformat>=5.10",
  "xxhash>=3.4",
]

[project.optional-dependencies]

# Additional model families not needed for the core golden path.
models = [
  "xgboost>=2.0",
  "catboost>=1.2",
  "kmodes>=0.12",
  "mlxtend>=0.23",
]

# Hyperparameter tuning backends. sklearn's own GridSearch/HalvingSearch is in core;
# optuna is the recommended drop-in for pycaret 4.0.
tuners = [
  "optuna>=3.6",
  "optuna-integration>=3.6",
  "scikit-optimize>=0.10",
  "hyperopt>=0.2.7",
]

# Interpretability and dimensionality reduction.
analysis = [
  "shap>=0.46",
  "interpret>=0.6",
  "umap-learn>=0.5",
]

# Anomaly detection models from pyod.
# (Kept as an extra because pyod pulls numba and can slow install.)
anomaly = [
  "pyod>=2.0",
  "numba>=0.60",
]

# Time-series forecasting. Heaviest single extra — kept isolated so that
# classification/regression users don't pay the sktime install cost.
timeseries = [
  "statsmodels>=0.14",
  "sktime>=0.36",
  "pmdarima>=2.0.4",
  # tbats and statsforecast removed from default extras.
  # - statsforecast: needed a C toolchain to build on Python 3.14 (no wheel).
  # - tbats: declares `numpy<2` which conflicts with the NumPy 2.x modernization.
  # No PyCaret code imports either directly; both are referenced only by
  # model-container id strings. Users who want them can install manually.
]

# Optional prophet backend for time-series.
prophet = ["prophet>=1.1.5"]

# Everything a power user might want, in one go.
full = [
  "pycaret[models,tuners,analysis,anomaly,timeseries]",
]

# Developer tooling.
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

# CI test dependencies.
test = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "pytest-cov>=5.0",
  "nbval>=0.11",
]

[project.urls]
Homepage = "https://pycaret.org/"
Repository = "https://github.com/pycaret/pycaret"
Documentation = "https://pycaret.gitbook.io/"
Issues = "https://github.com/pycaret/pycaret/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycaret"]

[tool.hatch.build.targets.sdist]
include = [
  "/pycaret",
  "/README.md",
  "/LICENSE",
  "/docs/revamp",
]

# --- tooling ---

[tool.ruff]
line-length = 100
target-version = "py313"

# Exclude the legacy god-class + 3.x-era preprocessing / container / patch code
# from lint. It's being drained verb-by-verb as part of the Phase 5 migration;
# running ruff against code that's scheduled for deletion creates noise.
# Lint is enforced on the new 4.0 surface only.
exclude = [
  "pycaret/internal",
  "pycaret/containers",
  "pycaret/classification/oop.py",
  "pycaret/regression/oop.py",
  "pycaret/clustering/oop.py",
  "pycaret/anomaly/oop.py",
  "pycaret/time_series/forecasting/oop.py",
  "pycaret/loggers",
  "pycaret/distributions.py",
  "pycaret/datasets.py",
  "pycaret/utils",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501", # line length handled by formatter
  "E731", # lambdas are fine
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"pycaret/distributions.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
  "plotting: tests that render plots",
  "tuning_grid: grid-search tuning tests",
  "tuning_random: random-search tuning tests",
  "slow: tests that take > 5s",
]
filterwarnings = [
  "ignore::DeprecationWarning:sktime",
  "ignore::FutureWarning:sktime",
]

[dependency-groups]
dev = [
  "pycaret[dev,test]",
]
