[project]
name = "pycaret"
version = "3.4.0"
description = "PyCaret - An open source, low-code machine learning library in Python."
readme = "README.md"
keywords = [
  "data-mining",
  "data-science",
  "classification",
  "clustering",
  "detection",
  "forecasting",
  "machine-learning",
  "regression",
  "scikit-learn<1.5",
  "time-series",
]
license = { file = "LICENSE" }
maintainers = [
  { name = "pycaret developers" },
]
# for full credits see contributors.md
authors = [
    { name = "pycaret developers" },
]
requires-python = ">=3.10,<3.14"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
]
# core dependencies of pycaret
# this set should be kept minimal!
dependencies = [
  # Base
  "ipython>=5.5.0",
  "ipywidgets>=7.6.5",
  "tqdm>=4.62.0",
  "numpy>=1.21,<2.0; python_version<'3.13'",
  "numpy>=2.0; python_version>='3.13'",
  "pandas>=1.5.0,<2.2; python_version<'3.13'",
  "pandas>=2.2.0; python_version>='3.13'",
  "jinja2>=3",
  "scipy>=1.6.1,<=1.11.4; python_version<'3.13'",
  "scipy>=1.14.0; python_version>='3.13'",
  "joblib>=1.4.2",
  "scikit-learn>=1.0,<1.5; python_version<'3.13'",
  "scikit-learn>=1.5; python_version>='3.13'",
  "pyod>=1.1.3",
  "imbalanced-learn>=0.12.0",
  "category-encoders>=2.4.0",
  "lightgbm>=3.0.0",
  "numba>=0.55.0; python_version<'3.13'",
  "numba>=0.60.0,<0.63; python_version>='3.13'",
  "requests>=2.27.1",
  "psutil>=5.9.0",
  "markupsafe>=2.0.1",
  "importlib_metadata>=4.12.0",
  "nbformat>=4.2.0",
  "cloudpickle",
  "deprecation>=2.1.0",
  "xxhash",
  "wurlitzer; platform_system != 'Windows'",
  "trio>=0.22.0,<0.25.0; python_version<'3.13'",
  "trio>=0.27.0; python_version>='3.13'",
  "setuptools; python_version>='3.12'",
  "packaging>=21.0",
  # Plotting
  "matplotlib>=3.5.0,<3.8.0; python_version<'3.13'",
  "matplotlib>=3.8.0; python_version>='3.13'",
  "mljar-scikit-plot",
  "yellowbrick>=1.4; python_version<'3.13'",
  "yellowbrick>=1.5; python_version>='3.13'",
  "plotly>=5.14.0",
  "kaleido>=0.2.1",
  "schemdraw==0.15",
  "plotly-resampler>=0.8.3.1",
  # Time-series
  "statsmodels>=0.12.1",
  "sktime>=0.31.0",
  "tbats>=1.1.3",
  "pmdarima>=2.0.4; python_version<'3.13'",
  "pmdarima>=2.1.0; python_version>='3.13'",
]

[project.optional-dependencies]
# there are the following dependency sets:
# - full - all soft dependencies
# - analysis
# - models
# - tuners
# - mlops
# - parallel
# - dev
# - test

# soft dependencies are not required for the core functionality of pycaret

# all soft dependencies
#
# users can install via "pip install pycaret[full]"
#
full = [
  "shap>=0.49.1,<0.50.0; python_version < '3.11'",
  "shap>=0.50.0; python_version >= '3.11'",
  "interpret>=0.2.7",
  "umap-learn>=0.5.2",
  "pyyaml",
  "ydata-profiling>=4.3.1,<4.13; python_version<'3.10'",
  "ydata-profiling>=4.13.0; python_version>='3.10'",
  "standard-imghdr; python_version>='3.13'",
  "explainerdashboard>=0.3.8",
  "fairlearn>=0.7.0",
  "xgboost>=2.0.0,<3.1.0; python_version < '3.11'",
  "xgboost>=3.1.1; python_version >= '3.11'",
  "catboost>=1.2.5",
  "kmodes>=0.11.1",
  "mlxtend>=0.19.0",
  "statsforecast>=1.6.0",
  "scikit-learn-intelex>=2024.0.0; (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
  "tune-sklearn; python_version<'3.13'",
  "ray[tune]; python_version<'3.13'",
  "hyperopt>=0.2.7",
  "optuna>=3.0.0",
  "optuna-integration",
  "scikit-optimize>=0.9.0; python_version<'3.12'",
  "mlflow>=2.0.0",
  "gradio>=3.50.2",
  "boto3>=1.24.56",
  "fastapi",
  "uvicorn>=0.17.6",
  "m2cgen>=0.9.0",
  "evidently>=0.7.0,<0.8.0",
  "dask>=2024.1.0",
  "distributed>=2024.1.0",
  "fugue>=0.9.0",
  "flask",
  "Werkzeug>=2.2",
  "pytest>=8.0.0",
  "moto>=4.0.0",
  "fugue[dask]",
  "dash[testing]",
  "black>=24.8.0",
  "isort>=5.13.2",
  "flake8>=7.1.1",
  "setuptools>=71.1.0",
  "mypy>=1.0.0",
]

analysis = [
  "shap>=0.49.1,<0.50.0; python_version < '3.11'",
  "shap>=0.50.0; python_version >= '3.11'",
  "interpret>=0.2.7",
  "umap-learn>=0.5.2",
  "pyyaml",
  "ydata-profiling>=4.3.1,<4.13; python_version<'3.10'",
  "ydata-profiling>=4.13.0; python_version>='3.10'",
  "standard-imghdr; python_version>='3.13'",
  "explainerdashboard>=0.3.8",
  "fairlearn>=0.7.0",
]

models = [
  "xgboost>=2.0.0,<3.1.0; python_version < '3.11'",
  "xgboost>=3.1.1; python_version >= '3.11'",
  "catboost>=1.2.5",
  "kmodes>=0.11.1",
  "mlxtend>=0.19.0",
  "statsforecast>=1.6.0",
  "scikit-learn-intelex>=2024.0.0; (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]

tuners = [
  "tune-sklearn; python_version<'3.13'",
  "ray[tune]; python_version<'3.13'",
  "hyperopt>=0.2.7",
  "optuna>=3.0.0",
  "optuna-integration",
  "scikit-optimize>=0.9.0; python_version<'3.12'",
]

mlops = [
  "mlflow>=2.0.0",
  "gradio>=3.50.2",
  "boto3>=1.24.56",
  "fastapi",
  "uvicorn>=0.17.6",
  "m2cgen>=0.9.0",
  "evidently>=0.7.0,<0.8.0",
]

parallel = [
  "dask>=2024.1.0",
  "distributed>=2024.1.0",
  "fugue>=0.9.0",
  "flask",
  "Werkzeug>=2.2",
]

prophet = [
  "prophet>=1.0.1",
]

# dev - the developer dependency set, for contributors to sktime
dev = [
  "black>=24.8.0",
  "isort>=5.13.2",
  "flake8>=7.1.1",
  "setuptools>=71.1.0",
  "mypy>=1.0.0",
]


# CI related soft dependency sets - not for users of pycaret
# they are stable and subject to deprecation policies
test = [
  "anywidget>=0.9.13",
  "pytest>=8.0.0",
  "moto>=4.0.0",
  "fugue[dask]",
  "dash[testing]",
]


[project.urls]
"API Reference" = "https://pycaret.gitbook.io/"
Documentation = "https://pycaret.gitbook.io/"
Download = "https://pypi.org/project/pycaret/#files"
Homepage = "https://pycaret.org/"
"Release Notes" = "https://github.com/pycaret/pycaret/releases"
Repository = "https://github.com/pycaret/pycaret"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>61",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
