name: Bug Report (PyCaret 4.0)
description: Report incorrect behavior in PyCaret 4.0
title: "[BUG]: "
labels: [bug, "4.0-candidate"]

body:
  - type: markdown
    attributes:
      value: |
        ## Before filing
        - PyCaret 4.0 is still WIP on the [`v4` branch](https://github.com/pycaret/pycaret/tree/v4). If you're on `master` (3.4.0) please **use 3.x templates**, not this one.
        - For 4.0 bugs, install from the v4 branch: `pip install git+https://github.com/pycaret/pycaret.git@v4`
        - Check [`docs/revamp/KILL_LIST.md`](https://github.com/pycaret/pycaret/blob/v4/docs/revamp/KILL_LIST.md) — the feature you're asking about may have been deliberately removed in 4.0.
        - Search [existing issues](https://github.com/pycaret/pycaret/issues) before filing.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm reporting against the **4.0 `v4` branch**, not 3.x.
          required: true
        - label: I've confirmed the feature I'm asking about is not on the 4.0 kill list (`docs/revamp/KILL_LIST.md`).
          required: true

  - type: textarea
    id: description
    attributes:
      label: Issue description
      description: One paragraph description of what's wrong.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: |
        Use PyCaret 4.0's OOP API. Prefer bundled datasets so maintainers can
        reproduce without extra files.
      render: python
      placeholder: |
        from pycaret.datasets import get_data
        from pycaret.tasks import ClassificationExperiment

        df = get_data("juice")
        exp = ClassificationExperiment(target="Purchase", session_id=42).fit(df)
        # ... your repro continues here ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / traceback
      description: Paste the full traceback inside a fenced code block.
      render: python-traceback
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: |
        Paste the output of:
        ```
        import pycaret; print(pycaret.__version__)
        import sys, sklearn, numpy, pandas; print(sys.version, sklearn.__version__, numpy.__version__, pandas.__version__)
        ```
    validations:
      required: true
