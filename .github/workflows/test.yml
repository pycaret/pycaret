name: pycaret

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list_notebooks:
    runs-on: ubuntu-latest
    name: List notebooks
    outputs:
      notebooks: ${{ steps.set-matrix.outputs.notebooks }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - id: set-matrix
        name: Build notebook matrix
        shell: bash
        run: |
          python - <<'PY' > notebooks.json
          import glob
          import json

          notebooks = sorted(glob.glob("tutorials/**/*.ipynb", recursive=True))
          notebooks = [p for p in notebooks if "tutorials/translations/" not in p]

          print(json.dumps(notebooks))
          PY

          echo "notebooks=$(cat notebooks.json)" >> "$GITHUB_OUTPUT"

  test_notebooks:
    runs-on: ubuntu-latest
    needs: list_notebooks
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.list_notebooks.outputs.notebooks) }}
    name: Notebook ${{ matrix.notebook }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv pip install -U pytest pytest-xdist nbmake

          # https://github.com/yaml/pyyaml/issues/736
          echo 'Cython < 3.0' > /tmp/constraint.txt
          PIP_CONSTRAINT=/tmp/constraint.txt pip wheel PyYAML==5.4.1

          python -m uv pip install ".[full]"
          python -m ipykernel install --user --name cikernel
      - name: Python version and dependency list
        run: |
          echo "Python version expected: 3.12"
          python --version
          which python
          pip list
      - name: Run notebook
        run: pytest --nbmake --nbmake-kernel=cikernel --nbmake-timeout=3000 "${{ matrix.notebook }}"
