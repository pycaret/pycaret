name: CI

# 4.0 CI. Runs on v4 (4.0 development branch) and any PRs targeting it.
# - lint: ruff check + format check
# - test: pytest on ubuntu + windows × python 3.11 / 3.12 / 3.13
# - notebooks: re-execute all canonical notebooks (nightly + on-demand)
#
# The workflow uses `uv` for environment management to match local dev.

on:
  push:
    branches: [v4, master, main]
  pull_request:
    branches: [v4, master, main]
  schedule:
    # Re-execute the canonical notebook suite nightly at 05:00 UTC so any
    # upstream dep regression (sklearn / NumPy / pandas / sktime) shows up
    # without waiting for a PR.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------- lint

  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: ruff check
        run: uv run --with ruff ruff check pycaret tests pycaret-server
      - name: ruff format --check
        run: uv run --with ruff ruff format --check pycaret tests pycaret-server

  # --------------------------------------------------------------- test

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: uv sync (all workspace packages + all extras)
        run: uv sync --all-packages --all-extras

      - name: Environment summary
        run: |
          uv run python -c "import sys; print('Python', sys.version)"
          uv run python -c "import sklearn, numpy, pandas, pycaret; print(f'pycaret {pycaret.__version__}  sklearn {sklearn.__version__}  numpy {numpy.__version__}  pandas {pandas.__version__}')"
          uv run --package pycaret-server python -c "from pycaret_server import __version__; print(f'pycaret-server {__version__}')"

      - name: pytest engine
        run: uv run pytest tests/ -q --durations=10

      - name: pytest server
        run: uv run --package pycaret-server pytest pycaret-server/tests/ -q --durations=10

  # --------------------------------------------------------------- ui

  ui:
    # Fast, independent job — doesn't need the Python matrix.
    runs-on: ubuntu-latest
    name: UI (typecheck + lint + test + build)
    defaults:
      run:
        working-directory: pycaret-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pycaret-ui/package-lock.json
      - name: npm install
        run: npm ci --include=dev 2>/dev/null || npm install
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build

  # --------------------------------------------------------------- notebooks

  notebooks:
    # Nightly + manual only. PRs don't re-execute notebooks (slow, brittle).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Re-execute canonical notebooks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: uv sync --all-extras
        run: uv sync --all-extras
      - name: Install nbclient + ipykernel
        run: uv pip install nbclient ipykernel
      - name: Execute notebooks
        run: uv run python scripts/build_notebooks.py --run

  # --------------------------------------------------------------- ci-status

  ci-status:
    # Aggregate job so branch protection can require a single `ci-status` check.
    runs-on: ubuntu-latest
    needs: [lint, test, ui]
    if: always()
    steps:
      - name: Report status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.ui.result }}" != "success" ]]; then
            echo "lint=${{ needs.lint.result }}  test=${{ needs.test.result }}  ui=${{ needs.ui.result }}"
            exit 1
          fi
          echo "All required jobs succeeded."
