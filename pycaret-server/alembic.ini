; Alembic config — PyCaret server.
;
; The database URL is supplied by env.py at runtime, picked up from
; `pycaret_server.config.get_settings().database_url`, so leave the
; value here empty. Override for one-off ops via `ALEMBIC_URL=... alembic ...`.

[alembic]
script_location = pycaret_server/migrations
prepend_sys_path = .
; No literal URL here — see env.py for runtime resolution.
sqlalchemy.url =
timezone = UTC
; revision filename template (date + slug)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
; No post-write hooks; run `ruff format` manually on generated revisions.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
