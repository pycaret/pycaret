[project]
name = "pycaret-client"
version = "0.1.0a0"
description = "Python SDK for the PyCaret Control Plane API."
readme = "README.md"
license = "MIT"
authors = [{ name = "PyCaret developers" }]
maintainers = [{ name = "Moez Ali", email = "moez.ali@queensu.ca" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]
test = ["pytest>=8.3", "pytest-cov>=5.0", "responses>=0.25"]

[project.urls]
Repository = "https://github.com/pycaret/pycaret"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycaret_client"]
