# UI container nginx config.
#
# Serves the static Vite bundle on :8080, proxies /api and /ws to the
# backend service (name "api" inside docker-compose's default network).
# The SPA gets a history-API fallback so deep links work.

upstream pycaret_api {
  server api:8020;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed assets aggressively; index.html must never be cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Backend API. WebSocket upgrade for /ws.
  location /api/ {
    proxy_pass http://pycaret_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /api/v1/runs/ {
    proxy_pass http://pycaret_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /healthz {
    proxy_pass http://pycaret_api;
  }

  # SPA fallback — any path not matched above serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
